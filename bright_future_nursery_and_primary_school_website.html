                                            <p className="font-bold text-brand-dark">Location Map</p>
                                            <p className="text-xs text-gray-500 mt-1 mb-4">[Google Maps Link]</p>

                                                    ✓
                                                </div>
                                                <h4 className="text-xl font-bold text-emerald-900">Message Received!</h4>
                                                <p className="text-emerald-800 text-base font-medium">
                                                    Thank you for contacting Bright Future. Our admissions team will get back to you shortly.
                                                </p>
                                                <button 
                                                    onClick={() => setFormSubmitted(false)}
                                                    className="mt-4 bg-emerald-600 text-white font-bold text-xs px-6 py-2.5 rounded-xl"

                                            <form onSubmit={handleFormSubmit} className="space-y-4">

                                                        </label>

                                                            type="text" 
                                                            name="fullName"
                                                            required
                                                            value={formData.fullName}
                                                            onChange={handleInputChange}
                                                            placeholder="e.g. Mrs. Funke Adebayo"
                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">
                                                            Child's Name *
                                                        </label>
                                                        <input 
                                                            type="text" 
                                                            name="childName"
                                                            required
                                                            value={formData.childName}
                                                            onChange={handleInputChange}
                                                            placeholder="e.g. Daniel Adebayo"
                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>
                                                </div>

                                                <div className="grid sm:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">
                                                            Child's Age *
                                                        </label>
                                                        <input 
                                                            type="text" 
                                                            name="childAge"
                                                            required
                                                            value={formData.childAge}
                                                            onChange={handleInputChange}
                                                            placeholder="e.g. 4 years"
                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">
                                                            Preferred Class or Programme
                                                        </label>
                                                        <select 
                                                            name="programme"
                                                            value={formData.programme}
                                                            onChange={handleInputChange}
                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white"

                                                <div className="grid sm:grid-cols-2 gap-4">

                                                        <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">
                                                            Phone Number *
                                                        </label>
                                                        <input 
                                                            type="tel" 
                                                            name="phone"
                                                            required
                                                            value={formData.phone}
                                                            onChange={handleInputChange}
                                                            placeholder="[Phone Number]"
                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">

                                                        <input

                                                            name="email"
                                                            required
                                                            value={formData.email}
                                                            onChange={handleInputChange}

                                                            className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />

                                                </div>

                                                        {['WhatsApp', 'Phone', 'Email'].map((method) => (

                                                                <input 
                                                                    type="radio" 
                                                                    name="preferredContact" 
                                                                    value={method}
                                                                    checked={formData.preferredContact === method}
                                                                    onChange={handleInputChange}
                                                                    className="text-brand-500 focus:ring-brand-500"
                                                                />
                                                                {method}
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">
                                                        Message / Special Questions
                                                    </label>
                                                    <textarea 
                                                        name="message"
                                                        rows="3"
                                                        value={formData.message}
                                                        onChange={handleInputChange}
                                                        placeholder="Tell us any specific details or questions you have..."
                                                        className="w-full px-4 py-3 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                    ></textarea>
                                                </div>

                                                <button 
                                                    type="submit"
                                                    className="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 rounded-xl shadow-soft-pink hover:shadow-md transition-all text-base mt-2"
                                                >
                                                    Send Enquiry
                                                </button>

                                            </form>
                                        )}
                                    </div>

                                </div>

                            </div>
                        </section>

                    </main>

                                {/* Brand Info */}
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white font-black text-lg">

                                        <span className="font-extrabold text-2xl tracking-tight text-white">
                                            Bright Future
                                        </span>
                                    </div>
                                    <p className="text-xs italic text-brand-200">
                                        “Nurturing Bright Minds for a Beautiful Future”

                                    <p className="text-xs text-purple-200 leading-relaxed">

                                        <li><a href="#gallery" className="hover:text-white transition-colors">School Gallery</a></li>
                                        <li><a href="#contact" className="hover:text-white transition-colors">Contact Us</a></li>
                                    </ul>

                                {/* Programmes Links */}
                                <div className="space-y-3">
                                    <h4 className="font-bold text-sm text-brand-yellow uppercase tracking-wider">Our Programmes</h4>

                                        <li><a href="#programmes" className="hover:text-white transition-colors">Early Years Programme</a></li>
                                        <li><a href="#programmes" className="hover:text-white transition-colors">Nursery Education</a></li>
                                        <li><a href="#programmes" className="hover:text-white transition-colors">Primary School</a></li>
                                        <li><a href="#programmes" className="hover:text-white transition-colors">Literacy & Reading</a></li>
                                        <li><a href="#programmes" className="hover:text-white transition-colors">Creative Arts & Play</a></li>
                                    </ul>
                                </div>

                                <div className="space-y-4">

                                    <div className="space-y-2 text-xs text-purple-200">
                                        <p>📍 [School Address]</p>
                                        <p>📞 [Phone Number]</p>
                                        <p>💬 [WhatsApp Number]</p>
                                        <p>✉️ [Email Address]</p>

                                    {/* Social Icons Placeholders */}
                                    <div className="flex gap-3 pt-2">
                                        <a href="#contact" className="w-8 h-8 rounded-full bg-purple-900 hover:bg-brand-500 text-white flex items-center justify-center text-xs transition-colors" title="Instagram">IG</a>
                                        <a href="#contact" className="w-8 h-8 rounded-full bg-purple-900 hover:bg-brand-500 text-white flex items-center justify-center text-xs transition-colors" title="Facebook">FB</a>
                                        <a href="#contact" className="w-8 h-8 rounded-full bg-purple-900 hover:bg-emerald-500 text-white flex items-center justify-center text-xs transition-colors" title="WhatsApp">WA</a>
                                    </div>
                                </div>

                            </div>

                            {/* Copyright & Legal */}
                            <div className="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-purple-300">

                                    <a href="[Admission Link]" className="hover:underline text-brand-yellow">[Admission Link]</a>
                                </div>
                            </div>

                                    onClick={() => setVisitModalOpen(false)}

                                    <p className="text-sm text-gray-600">
                                        We invite parents to experience Bright Future firsthand. Please choose your preferred date and contact channel.

                                            required 
                                            placeholder="Your Name" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500"

                                        <input 
                                            type="tel" 
                                            required 
                                            placeholder="[Phone Number]" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500"

                                            type="date" 
                                            required 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500" 
                                        />
                                        <button 
                                            type="submit" 
                                            className="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl shadow-soft-pink"

                                    onClick={() => setAdmissionModalOpen(false)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 p-2 rounded-full"

                                    <IconX />

                                        📝
                                    </div>
                                    <h3 className="text-2xl font-bold text-brand-dark">Admissions Enquiry</h3>
                                    <p className="text-sm text-gray-600">
                                        Begin your child's journey at Bright Future. Fill in your details below and our admissions counsellor will contact you.

                                    <form onSubmit={(e) => { e.preventDefault(); setAdmissionModalOpen(false); alert("Admissions enquiry submitted! Thank you for choosing Bright Future."); }} className="space-y-3 pt-2">
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Parent's Name" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500" 
                                        />
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Child's Name & Age" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500" 
                                        />
                                        <input 
                                            type="tel" 
                                            required 
                                            placeholder="[Phone Number]" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-purple-200 text-sm focus:ring-2 focus:ring-brand-500" 
                                        />
                                        <button 
                                            type="submit" 
                                            className="w-full bg-brand-dark hover:bg-brand-purple text-white font-bold py-3 rounded-xl shadow-md"
                                        >
                                            Submit Admission Request
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LIGHTBOX MODAL FOR GALLERY */}
                    {galleryModalImage && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn" onClick={() => setGalleryModalImage(null)}>
                            <div className="bg-white rounded-3xl p-4 max-w-2xl w-full relative overflow-hidden" onClick={e => e.stopPropagation()}>
                                <button 
                                    onClick={() => setGalleryModalImage(null)}
                                    className="absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full z-10"
                                >
                                    <IconX />
                                </button>
                                <img src={galleryModalImage.url} alt={galleryModalImage.title} className="w-full h-80 object-cover rounded-2xl" />
                                <div className="p-4">
                                    <span className="text-xs font-bold text-brand-500 uppercase">{galleryModalImage.category}</span>
                                    <h4 className="text-xl font-bold text-brand-dark">{galleryModalImage.title}</h4>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
